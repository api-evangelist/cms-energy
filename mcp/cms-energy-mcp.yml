gaps:
  - >-
    The Green Button tools inherit the rate guidance in rate-limits/ — bill and interval
    downloads at most once a minute — which an MCP server would have to enforce rather than
    expose raw.
  - >-
    No tool can be exercised end to end without a Consumers Energy third-party registration and a
    customer authorization, so a hosted server would be per-tenant, not public.
