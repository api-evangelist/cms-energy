x-spec-provenance:
  checked: '2026-09-06'
  note: 'The five Green Button specs in openapi/ derive from openapi/_original/cms-energy-openapi.yml, which describes
    itself in info.description as a "Best-effort OpenAPI 3.1 description" — it was authored from the provider documentation,
    not fetched from the provider. It is NOT a harvested contract, despite living under openapi/_original/, and
    provenance.yml therefore records it as "harvested" incorrectly. Its operations match the documented endpoint
    surface, but at least one field is demonstrably invented: securitySchemes.oauth2 carries tokenUrl https://utilityapi.com/api/v2/oauth/token,
    which returns HTTP 404 (the real token endpoint is the per-utility https://utilityapi.com/DataCustodian/{utility}/oauth/token).
    Flagged, not deleted; a scaffold sweep owns the remediation.'
  ownership: 'The Green Button surface is served on utilityapi.com, not a CMS Energy domain. That is legitimate
    and documented: Consumers Energy runs its Green Button Connect My Data program on UtilityAPI''s EE/DER Engagement
    Platform and, from its own host https://greenbutton.consumersenergy.com/, links utilityapi.com/docs/utilities/consumersenergy
    as its "API Documentation" and utilityapi.com/dashboard?utility_branding=CONSUMERSENERGY as its third-party
    dashboard. The operator is the vendor; the program is Consumers Energy''s. The ArcGIS outage API is by contrast
    fully first-party, served from www.consumersenergy.com.'
  evidence:
  - url: https://greenbutton.consumersenergy.com/
    status: 200
  - url: https://utilityapi.com/api/v2/oauth/token
    status: 404
  - url: https://utilityapi.com/DataCustodian/espi/1_1/resource/ReadServiceStatus
    status: 401
  - url: https://www.consumersenergy.com/arcgispublic/rest/services?f=json
    status: 200
