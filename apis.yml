description: CMS Energy is an energy holding company whose primary subsidiary is Consumers Energy, an electric and
  natural gas utility serving customers in Michigan. Consumers Energy participates in the Green Button Connect My
  Data (GBCMD) program, exposing customer-authorized energy usage data to third parties via OAuth 2.0 - typically
  brokered through UtilityAPI - for use in energy management, demand response, EV charging, solar, and sustainability
  applications.
