- aid: cms-energy:cms-energy-outage-map-api
  name: Consumers Energy Outage Map ArcGIS REST API
  description: Consumers Energy publishes its outage map data as an anonymous Esri ArcGIS Server 11.5 REST Services
    Directory on its own domain — no key, no account, no registration. CEOutageMap carries seven layers including
    the electric service territory polygon and live outage jobs (JOB_ID, CUSTOMER_COUNT, CAUSE_CD, CAUSE_DESC, OUTAGE_TIME,
    EST_TIME_RESTORATION, CREW_ASSIGNED); ServiceDashboard carries five county- and city-level rollups (CE_County_Outages,
    CE_City_Outages, CustomersInterruptedPercent, NumberOfInterruptions, NumberOfWireDowns) over both a MapServer
    and a FeatureServer. Every map service also publishes a WSDL 1.1 SOAP contract with 55 operations. This is the
    only first-party, CMS-Energy-operated machine-readable API surface in the profile.
  humanURL: https://www.consumersenergy.com/outagemap
  baseURL: https://www.consumersenergy.com/arcgispublic/rest
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
