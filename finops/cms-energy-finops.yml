principles:
  - name: Visibility
    description: Reconcile usage against partner contracts via the partner's reporting deliverables; Green
      Button Connect access is observable through the customer's authorization log.
  - name: Allocation
    description: Allocate partner-integration costs to the consuming demand-response or settlement program;
      Green Button Connect carries no allocable cost.
  - name: Optimization
    description: Right-size partner contract scope at each renewal; ensure Green Button Connect implementation
      is up to date with NAESB ESPI revisions to avoid out-of-band custom integrations.
  - name: Accountability
    description: Assign a partner-integration owner accountable for renewal and utilization review; assign
      a Green Button Connect program owner accountable for NAESB ESPI compliance.
