specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CMS Energy
providerId: cms-energy
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Electric
  - Energy
  - Green Button
  - Utility
  - Rate Limiting
notes: CMS Energy / Consumers Energy does not publish numeric rate limits for Green Button Connect; the
  NAESB ESPI specification governs polling frequency (typically once per day for residential interval data).
  Other partner integrations are governed bilaterally.
description: 'Rate limits for CMS Energy customer-data sharing follow the NAESB ESPI / Green Button Connect
  conventions: data-custodian polling once per billing-period or once per day for interval data, with reauthorization
  required when consents expire. Specific numeric ceilings are not publicly documented.'
sources:
  - https://www.greenbuttondata.org/
  - https://www.consumersenergy.com
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Green Button Connect polling
    scope: third-party-application
    metric: requests_per_day
    limit: see NAESB ESPI / Green Button Connect implementation
    notes: Typical Green Button Connect implementations expect third parties to poll once per day per authorized
      customer. CMS-specific ceiling is not publicly documented.
  - name: Partner-contract defined
    scope: account
    metric: varies
    limit: see partner agreement
    notes: Limits are negotiated as part of each partner integration agreement.
policies:
  - name: NAESB ESPI compliance
    description: Green Button Connect access follows the NAESB ESPI specification. Third parties authenticate
      via OAuth 2.0 and refresh tokens as required by ESPI.
  - name: Backoff strategy
    description: On 429 responses, honor any Retry-After header and back off with jitter before retrying.
  - name: Bilateral contract
    description: Specific limits, retry policy, and SLAs for non-Green-Button integrations are governed
      by the partner integration contract.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
