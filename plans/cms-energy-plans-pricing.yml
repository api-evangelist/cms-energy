notes: CMS Energy operates Consumers Energy, a regulated electric and natural-gas utility in Michigan.
  The utility supports Green Button Connect (customer-authorized energy data sharing under the NAESB ESPI
  / Green Button Connect standard) at no charge to customers, but does not publish a public commercial
  API price list. Tariffs and demand-response programs are governed by Michigan Public Service Commission
  (MPSC) filings. The plans below preserve the API Commons structure without fabricating numbers.
description: CMS Energy / Consumers Energy provides Green Button Connect for customer-authorized energy
  data sharing at no charge. Other partner integrations (demand response, EDI, settlement) are governed
  by MPSC-filed tariffs or bilateral agreements rather than a public API price list.
sources:
  - https://www.consumersenergy.com
  - https://www.greenbuttondata.org/
plans:
  - id: cms-energy-green-button-connect
    name: Green Button Connect
    type: freemium
    description: Customer-authorized energy data sharing under the NAESB ESPI / Green Button Connect specification.
      No charge to the customer or to authorized third-party recipients of the customer's data.
    entries:
      - label: Customer-authorized data access
        name: gbc_data_access
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: NAESB ESPI / Green Button Connect compliance
      - name: OAuth-authorized third-party access
      - name: Customer self-service
  - id: cms-energy-partner
    name: Partner Integration
    type: enterprise
    description: Custom-negotiated partner integration (demand response, EDI, settlement). Governed by
      MPSC-filed tariffs or bilateral agreements.
    entries:
      - label: Partner Integration
        name: partner_integration
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: see MPSC tariff or partner agreement
        userMultiplied: false
    elements:
      - name: Custom partner integration
      - name: MPSC tariff alignment
