plans:
  - id: cms-energy-arcgis-public
    name: Consumers Energy public outage services
    type: free
    price: '0.00'
    currency: USD
    billing_period: none
    onboarding: none
    description: >-
      Anonymous ArcGIS REST and SOAP access to outage and service-territory geodata. No account,
      no key, no registration. Verified by an unauthenticated probe returning real data.
    limits:
      - maxRecordCount 1000 features per response
      - No published request-rate limit; robots.txt disallows crawling /arcgispublic/*
    elements:
      - name: CEOutageMap MapServer (7 layers)
      - name: ServiceDashboard MapServer and FeatureServer (5 layers)
      - name: WSDL 1.1 SOAP contracts (55 operations per map service)
  - id: cms-energy-green-button-connect
    name: Green Button Connect My Data — third party
    type: free
    price: '0.00'
    currency: USD
    billing_period: none
    onboarding: registration + utility review (not self-serve)
    description: >-
      Customer-authorized energy data sharing under NAESB ESPI / Green Button Connect My Data. No
      charge to the customer or to the authorized third party is stated anywhere; the gate is
      Consumers Energy's approval of the third-party registration, which moves the third party out
      of sandbox mode.
    quota:
      requests: unmetered — no quota is published
    limits:
      - Bill and interval downloads at most once per minute
      - All other GET and POST at most once per second
    elements:
      - name: NAESB ESPI / Green Button Connect My Data compliance
      - name: Green Button OAuth 2.0 customer authorization
      - name: Sandbox test scenarios before live approval
      - name: Opt-in webhooks
plan_count: 2
enterprise_only: false
public_price_list: false
