description: >-
  CMS Energy publishes NO API price list, and that is the finding rather than a gap in the search.
  Both public API surfaces are free at the point of use, for different reasons: the Consumers
  Energy ArcGIS outage services are anonymous public geodata with no account of any kind, and the
  Green Button Connect My Data program is described by Consumers Energy as "provided as a courtesy
  to Consumers Energy customers". Access to GBCMD is gated by registration and utility review, not
  by payment.
notes: >-
  Supersedes the 2026-05-04 bulk-sweep placeholder. Verified 2026-09-06: no pricing page, no fee
  schedule, and no charge language anywhere in the Consumers Energy Third Party Agreement at
  https://greenbutton.consumersenergy.com/third-party/terms (searched for fee / charge / cost —
  the only hits are indemnity boilerplate). The platform Consumers Energy licenses publishes its
  own pricing at https://utilityapi.com/pricing, but that is a price CMS Energy pays its vendor,
  not one a developer pays CMS Energy, so it is not recorded as a CMS Energy plan.
